services:
  - type: web
    name: shestays-api
    runtime: python
    plan: starter
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.12
    autoDeploy: true

  - type: cron
    name: notification-dispatcher
    schedule: "*/5 * * * *"
    runtime: python
    plan: starter
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.jobs.notifications"
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.12
      - fromService:
          name: shestays-api
          type: web
          property: envVars
    autoDeploy: true